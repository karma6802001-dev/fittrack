<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>FitTrack</title>
<style>
:root{
  --bg:#f3f4f6;--surface:#ffffff;--surface2:#eceef2;--border:#dfe3e9;
  --text:#11141a;--muted:#5b6474;--accent:#15803d;--accent-soft:#e3f6e9;--accent-ink:#ffffff;
  --water:#0369a1;--water-soft:#e0f0fa;--danger:#c62828;--grid:#e6e8ec;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1014;--surface:#171a21;--surface2:#20242d;--border:#2b303b;
  --text:#eceff4;--muted:#9aa3b4;--accent:#4ade80;--accent-soft:#11301d;--accent-ink:#052010;
  --water:#38bdf8;--water-soft:#0c2a3a;--danger:#f87171;--grid:#252a34;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root[data-theme="auto"]{
    --bg:#0e1014;--surface:#171a21;--surface2:#20242d;--border:#2b303b;
    --text:#eceff4;--muted:#9aa3b4;--accent:#4ade80;--accent-soft:#11301d;--accent-ink:#052010;
    --water:#38bdf8;--water-soft:#0c2a3a;--danger:#f87171;--grid:#252a34;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.timer-on{padding-bottom:calc(170px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.hdr-streak{font-size:14px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px}
.hdr-streak b{color:var(--text);font-size:16px}
main{max-width:560px;margin:0 auto;padding:4px 16px 16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin:12px 0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:24px 4px 4px;font-weight:700}
h3{margin:0 0 8px;font-size:18px}
p{margin:6px 0}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-weight:650;border-radius:14px;min-height:48px;padding:10px 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.block{width:100%}
.btn.big{min-height:60px;font-size:18px;border-radius:16px}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px;border-radius:12px;white-space:nowrap}
.btn.done{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:650;padding:0;font-size:inherit}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;min-height:48px}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
label.f{display:block;margin:10px 0}
label.f>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:650}
.seg{display:flex;background:var(--surface2);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border:0;background:transparent;color:var(--muted);border-radius:10px;font-weight:650;font-size:14px;padding:0 6px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto;position:relative}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;font-weight:650;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;margin:12px 0 4px}
.nav-btn{width:48px;height:48px;border-radius:14px;border:1px solid var(--border);background:var(--surface);font-size:24px;line-height:1}
.dmid{text-align:center}
.dtitle{font-size:22px;font-weight:800;letter-spacing:-.02em}
.dsub{font-size:14px;color:var(--muted)}
/* hero */
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pill{display:inline-block;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:5px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.rest{background:var(--surface2);color:var(--muted)}
.hero-sub{margin-top:6px;color:var(--muted);font-size:14px}
select.mini{width:auto;min-height:40px;padding:6px 10px;font-size:14px;border-radius:10px}
/* exercise card */
.ex-cat{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.ex-name{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.ex-target{font-size:14px;color:var(--muted)}
.last{font-size:13px;color:var(--muted);margin:8px 0 2px}
.set-row{display:grid;grid-template-columns:50px 48px 1fr 48px 56px;gap:8px;align-items:center;margin-top:8px}
.set-n{font-size:13px;font-weight:700;color:var(--muted)}
.step{height:48px;border-radius:12px;border:1px solid var(--border);background:var(--surface2);font-size:22px;font-weight:600}
.set-v{position:relative}
.set-v input{text-align:center;font-size:20px;font-weight:800;padding:6px 26px 6px 6px;font-variant-numeric:tabular-nums}
.set-v small{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
.set-check{height:48px;border-radius:12px;border:2px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center}
.set-check svg{width:24px;height:24px;stroke:var(--muted);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.set-row.done .set-check{background:var(--accent);border-color:var(--accent)}
.set-row.done .set-check svg{stroke:var(--accent-ink)}
.set-row.done input{color:var(--accent)}
.addset{margin-top:10px;background:none;border:0;color:var(--muted);font-weight:650;font-size:14px;min-height:40px;padding:0}
.levelup{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:14px;padding:12px;margin-top:10px;font-size:14px}
.levelup b{color:var(--accent)}
.topnote{background:var(--surface2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13px;color:var(--muted)}
/* checklist */
.check{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-top:1px solid var(--border);padding:12px 2px;min-height:60px;text-align:left}
.check{border-top:0!important}
.crow{display:flex;align-items:center;gap:8px}
.crow+.crow{border-top:1px solid var(--border)}
.check .box{flex:0 0 30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center}
.check .box svg{width:18px;height:18px;stroke:transparent;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.check.on .box{background:var(--accent);border-color:var(--accent)}
.check.on .box svg{stroke:var(--accent-ink)}
.check .lbl{font-weight:650}
.check .sub{font-size:13px;color:var(--muted)}
.perfect{font-size:14px;font-weight:700;color:var(--accent)}
/* progress bars */
.bar{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.water i{background:var(--water)}
.bignum{font-size:34px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.bignum small{font-size:16px;color:var(--muted);font-weight:650;letter-spacing:0}
/* water */
.glasses{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.glass{width:44px;height:52px;border-radius:8px 8px 12px 12px;border:2px solid var(--border);background:transparent;position:relative;overflow:hidden;padding:0}
.glass.full{border-color:var(--water);background:var(--water-soft)}
.glass.full::after{content:"";position:absolute;left:0;right:0;bottom:0;height:70%;background:var(--water);opacity:.85}
/* food */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--border);background:var(--surface2);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:650;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip .x{color:var(--danger);font-weight:800;margin-left:2px}
.chip small{color:var(--muted);font-weight:600}
.meal-h{display:flex;justify-content:space-between;font-weight:750;margin:14px 0 4px;text-transform:capitalize}
.meal-h span{color:var(--muted);font-weight:600;font-size:14px;text-transform:none}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.item .pr{font-weight:750;font-variant-numeric:tabular-nums}
.del{width:40px;height:40px;border-radius:10px;border:0;background:var(--surface2);color:var(--muted);font-size:18px;flex:0 0 40px}
.checkline{display:flex;align-items:center;gap:10px;margin:8px 0 12px;font-size:15px}
.checkline input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
/* progress */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px}
.stat .v{font-size:30px;font-weight:850;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .v small{font-size:15px;color:var(--muted);font-weight:650}
.stat .l{font-size:13px;color:var(--muted);font-weight:600}
.stat.hot .v{color:var(--accent)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1;border-radius:10px;border:1.5px solid transparent;background:var(--surface2);font-size:14px;font-weight:650;padding:0;font-variant-numeric:tabular-nums}
.cal button.done{background:var(--accent);color:var(--accent-ink)}
.cal button.rest{background:transparent;color:var(--muted)}
.cal button.missed{background:transparent;border:1.5px dashed var(--danger);color:var(--muted)}
.cal button.future{background:transparent;color:var(--muted);opacity:.6}
.cal button.today{outline:2px solid var(--text);outline-offset:1px}
.cal .blank{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-2px;margin-right:5px}
canvas.chart{width:100%;height:200px;display:block;touch-action:pan-y;margin-top:8px}
.ch-title{font-weight:750}
/* ladder */
.ladder{list-style:none;padding:0;margin:12px 0 6px}
.ladder li{position:relative;padding-left:26px}
.ladder li::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border)}
.ladder li:first-child::before{top:50%}.ladder li:last-child::before{bottom:50%}
.ladder li::after{content:"";position:absolute;left:3px;top:50%;margin-top:-6px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--border)}
.ladder li.past::after{background:var(--accent);border-color:var(--accent)}
.ladder li.cur::after{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.ladder button{background:none;border:0;padding:8px 6px;min-height:40px;text-align:left;width:100%;color:var(--muted);font-size:15px}
.ladder li.cur button{color:var(--text);font-weight:800}
.ladder li.past button{color:var(--text)}
/* settings */
.sched-row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;margin:8px 0}
.sched-row b{font-size:14px}
.set-line{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--border)}
.set-line:first-of-type{border-top:0}
.set-line input{width:110px;text-align:center;font-weight:700}
/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(65px + env(safe-area-inset-bottom));z-index:19;display:none;padding:0 12px 8px}
body.timer-on .timer{display:block}
.timer .in{max-width:560px;margin:0 auto;background:var(--text);color:var(--bg);border-radius:18px;padding:10px 12px 12px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.timer .tr{display:flex;align-items:center;gap:8px}
.timer .t{font-size:32px;font-weight:850;font-variant-numeric:tabular-nums;flex:1;letter-spacing:-.02em}
.timer .t small{font-size:13px;font-weight:650;opacity:.7;letter-spacing:0;margin-right:6px}
.timer button{min-height:48px;min-width:52px;border-radius:12px;border:0;background:rgba(127,127,127,.25);color:var(--bg);font-weight:750}
.timer .tbar{height:5px;border-radius:9px;background:rgba(127,127,127,.3);margin-top:8px;overflow:hidden}
.timer .tbar i{display:block;height:100%;background:var(--accent)}
/* modal & toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-150%);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:650;font-size:15px;z-index:60;transition:transform .25s;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast.on{transform:translate(-50%,0)}
.warn{background:var(--danger);color:#fff;padding:10px 16px;font-size:14px;text-align:center}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}

/* ===== v2: wallpapers, carousel, motion ===== */
.bgwall{position:fixed;inset:-20px;z-index:-1;background-size:cover;background-position:center;opacity:.13;filter:blur(3px) saturate(.85);pointer-events:none;transition:opacity .6s}
:root[data-theme="light"] .bgwall{opacity:.07}
@media (prefers-color-scheme:light){:root[data-theme="auto"] .bgwall{opacity:.07}}
.wp{background-color:#111;background-size:cover;background-position:center}
.wp-none{background-image:linear-gradient(135deg,#1c2430,#0a0d12 70%)}
.hero2{position:relative;border-radius:24px;overflow:hidden;min-height:240px;margin:12px 0;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;isolation:isolate;box-shadow:0 12px 34px rgba(0,0,0,.35)}
.hero2::before,.slide .banner::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,.5) 50%,rgba(0,0,0,.9) 100%)}
.wpimg{position:absolute;inset:0;z-index:-2}
.hero2 .wpimg{animation:kenburns 18s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.03)}to{transform:scale(1.14) translate(-2%,-1.5%)}}
.hero-top{position:absolute;top:14px;left:16px;right:14px;display:flex;justify-content:space-between;align-items:center}
.gl{background:rgba(255,255,255,.15)!important;color:#fff!important;border:1px solid rgba(255,255,255,.22)!important;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero2 .pill{font-size:12px}
.hero2 select option{color:#000}
.htitle{font-size:32px;font-weight:850;letter-spacing:-.03em;line-height:1.05}
.hsub{opacity:.82;font-size:14px;margin-top:4px}
.hrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.hero2 .grid2{margin-top:14px}
.ring{width:76px;height:76px;flex:0 0 76px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:rgba(255,255,255,.22)}
.ring .fg{stroke:#4ade80;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:850;font-variant-numeric:tabular-nums}
.car-head{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 8px}
.car-head .cnt{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.car-nav{display:flex;gap:8px}
.exedit-t{width:auto!important;padding:0 14px;border-radius:22px!important;font-size:14px!important;font-weight:750;color:var(--accent)}
.exedit-t.on{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:transparent!important}
.exedit-bar{margin:0 0 10px;animation:fadeUp .35s cubic-bezier(.2,.8,.2,1)}
.slide-del{position:absolute;top:10px;left:10px;min-width:40px;height:40px;border-radius:20px;border:0;background:rgba(220,38,38,.92);color:#fff;font-size:22px;font-weight:700;padding:0 10px;z-index:2;animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.slide-del.armed{font-size:14px}
.badge-custom{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.18);color:#fff;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.badge-done~.badge-custom,.badge-custom:has(~.badge-done){display:none}
.tag{font-size:10px;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:1px}
.car-nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:22px;line-height:1}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:4px 16px 10px;scroll-padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;align-items:flex-start;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 calc(100% - 26px);scroll-snap-align:start;scroll-snap-stop:always;background:var(--surface);border:1px solid var(--border);border-radius:24px;overflow:hidden;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .4s;transform-origin:center top}
.slide.dim{transform:scale(.94);opacity:.5}
.banner{height:160px;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 16px;color:#fff;isolation:isolate;overflow:hidden}
.banner .ex-cat{color:#fff;opacity:.85}
.banner .ex-name{color:#fff;font-size:25px;line-height:1.15}
.banner .ex-target{color:rgba(255,255,255,.82)}
.slide .sbody{padding:4px 16px 16px}
.badge-done{position:absolute;top:12px;right:12px;background:#4ade80;color:#052010;font-weight:800;font-size:12px;padding:5px 11px;border-radius:99px;animation:pop .45s cubic-bezier(.2,.8,.2,1)}
.dots{display:flex;justify-content:center;gap:2px;margin:2px 0 6px}

@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
main.enter>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
main.enter>*:nth-child(2){animation-delay:.05s}main.enter>*:nth-child(3){animation-delay:.1s}main.enter>*:nth-child(4){animation-delay:.15s}main.enter>*:nth-child(5){animation-delay:.2s}main.enter>*:nth-child(n+6){animation-delay:.25s}
.set-row.pop .set-check{animation:pop .4s cubic-bezier(.2,.8,.2,1)}
.set-row{transition:opacity .3s}
.check.pop .box{animation:pop .4s cubic-bezier(.2,.8,.2,1)}
.btn,.step,.set-check,.chip,.nav-btn,.glass,.check,.car-nav button,.wopt,nav.tabs button svg{transition:transform .15s cubic-bezier(.2,.8,.2,1),background-color .25s,border-color .25s,color .25s}
.btn:active,.step:active,.set-check:active,.chip:active,.nav-btn:active,.glass:active,.car-nav button:active,.wopt:active{transform:scale(.94)}
nav.tabs button.on svg{transform:translateY(-2px) scale(1.1)}
.ind{position:absolute;top:0;left:0;width:20%;height:3px;display:flex;justify-content:center;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.ind::after{content:"";width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}
.confetti{position:fixed;top:-16px;width:8px;height:14px;z-index:70;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
.toast{transition:transform .45s cubic-bezier(.2,1.3,.4,1)}
.overlay.on{animation:fadeIn .25s}
.overlay.on .sheet{animation:sheetUp .4s cubic-bezier(.2,.9,.25,1)}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}
.howpill{position:absolute;right:12px;bottom:14px;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.16);color:#fff;font-size:13px;font-weight:750;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.banner[data-a=howto]{cursor:pointer}
.banner .ex-target{padding-right:96px}
.demo-card{background:var(--surface2);border-radius:18px;margin-top:12px;overflow:hidden}
.demo{display:block;width:100%;height:auto}
.demo .fig path{fill:none;stroke:var(--text);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.demo .fig .far{opacity:.38}
.demo .fig circle{fill:var(--text)}
.demo .dp{stroke:var(--muted);stroke-width:4;stroke-linecap:round;opacity:.7}
.demo .dp-fill{fill:var(--muted);opacity:.45}
.demo .dp-bar{stroke:var(--muted);stroke-width:6;stroke-linecap:round}
.demo .dp-floor{stroke:var(--border);stroke-width:3}
.demo .dp-band{fill:none;stroke:#f59e0b;stroke-width:3;stroke-linejoin:round}
.how-chips{flex-wrap:nowrap;overflow-x:auto;margin:12px -16px 0;padding:0 16px 4px;scrollbar-width:none}
.how-chips::-webkit-scrollbar{display:none}
.how-chips .chip{flex:0 0 auto;min-height:38px;font-size:13px}
.how-chips .chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.howphoto{margin-top:10px;border-radius:16px;overflow:hidden;background:var(--surface2)}
.howphoto img{display:block;width:100%;max-height:360px;object-fit:contain}
.cues{margin:6px 0 0;padding-left:22px}
.cues li{margin:8px 0;line-height:1.45}
.cues li::marker{color:var(--accent);font-weight:800}
.works{margin-top:10px;font-size:14px;color:var(--muted)}
.works b{color:var(--text)}
.overlay.noanim,.overlay.noanim .sheet{animation:none!important}
/* wallpaper picker */
.wgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wopt{aspect-ratio:16/9;border-radius:14px;border:2px solid transparent;position:relative;overflow:hidden;color:#fff;font-weight:750;font-size:13px;display:flex;align-items:flex-end;padding:8px 10px;background-size:cover;background-position:center}
.wopt::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.7))}
.wopt span{position:relative}
.wopt.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.wopt.rotate{background-image:linear-gradient(135deg,#2b3441,#0b0e13)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<div class="warn" id="storageWarn" hidden>Storage is unavailable in this browser mode — data won't be saved. Open the file in a normal (non-private) browser tab.</div>
<header class="top"><div class="in"><div class="brand">Fit<span>Track</span></div><div class="hdr-streak" id="hdrStreak"></div></div></header>
<div class="bgwall" id="bgwall"></div>
<main id="main"></main>

<div class="timer" id="timer"><div class="in">
  <div class="tr">
    <div class="t" id="tTime"><small>REST</small>1:30</div>
    <button data-a="tadd" data-s="-15" aria-label="Minus 15 seconds">−15</button>
    <button data-a="tadd" data-s="15" aria-label="Plus 15 seconds">+15</button>
    <button data-a="tskip">Skip</button>
  </div>
  <div class="tbar"><i id="tBar"></i></div>
</div></div>

<nav class="tabs"><div class="in"><span class="ind" id="navInd"></span>
  <button data-tab="today"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4M8.5 15l2.5 2.5 4.5-5"/></svg>Today</button>
  <button data-tab="exercises"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/></svg>Exercises</button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0zM9 7c0-2 2-2 2-4M14 7c0-2 2-2 2-4"/></svg>Food</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M7 16v-4M12 16V6M17 16v-7"/></svg>Progress</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.5"/><circle cx="10" cy="12" r="2.5"/><circle cx="17.5" cy="18" r="2.5"/></svg>Settings</button>
</div></nav>

<div class="overlay" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="wallFile" accept="image/*" hidden>
<input type="file" id="photoFile" accept="image/*" hidden>
<style id="wallcss"></style>

<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const KEY='fittrack.v1', UIKEY='fittrack.ui';
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const WEEK=[1,2,3,4,5,6,0];
const MEALS=['breakfast','lunch','dinner','snacks'];
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pdate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=pdate(k);d.setDate(d.getDate()+n);return dkey(d)};
const today=()=>dkey(new Date());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(k,o)=>pdate(k).toLocaleDateString(undefined,o||{weekday:'short',day:'numeric',month:'short'});
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const num=(v,d)=>{const n=parseFloat(v);return isFinite(n)?n:d};
const round1=n=>Math.round(n*10)/10;
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- data ---------- */
const V=(n,unit)=>({n,unit:unit||'reps'});
function defaultExercises(){
  const mk=(id,name,day,sets,vars)=>({id,name,day,sets,min:8,max:15,tmin:20,tmax:60,level:0,vars});
  return [
    mk('push','Push','upper',4,['Incline push-up','Push-up','Decline push-up','Pike push-up','Elevated pike push-up','Handstand push-up'].map(n=>V(n))),
    mk('pull','Pull','upper',4,['Inverted row (under a table)','Negative pull-up','Band-assisted pull-up','Pull-up','Chin-up'].map(n=>V(n))),
    mk('dips','Dips','upper',3,['Bench dip','Chair dip','Parallel bar dip'].map(n=>V(n))),
    mk('legs','Legs','lower',4,['Bodyweight squat','Split squat','Bulgarian split squat','Assisted pistol squat','Pistol squat'].map(n=>V(n))),
    mk('lunges','Lunges','lower',3,[V('Walking lunges')]),
    mk('calves','Calves','lower',3,[V('Calf raises')]),
    mk('glutes','Glutes','lower',3,[V('Glute bridges')]),
    mk('core','Core','both',3,[V('Plank','sec'),V('Hanging knee raise'),V('Hanging leg raise')])
  ];
}
const FIXED_EX=['push','pull','dips','legs','lunges','calves','glutes','core'];
const isFixed=e=>!!e&&FIXED_EX.includes(e.id);
function defaults(){
  return {version:1,
    settings:{schedule:{0:'rest',1:'upper',2:'lower',3:'rest',4:'upper',5:'lower',6:'rest'},protein:120,water:8,rest:90,theme:'auto',startDate:today(),lastExport:null,wall:'rotate',bgWall:true},
    exercises:defaultExercises(),workouts:{},food:{},favourites:[],water:{},checks:{},body:[]};
}
function normalize(p){
  const d=defaults();
  const s=Object.assign(d,p);
  s.settings=Object.assign(defaults().settings,p.settings||{});
  s.settings.schedule=Object.assign(defaults().settings.schedule,(p.settings&&p.settings.schedule)||{});
  ['workouts','food','water','checks'].forEach(k=>{if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))s[k]={}});
  ['favourites','body'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
  if(!Array.isArray(s.exercises))s.exercises=defaultExercises();
  defaultExercises().forEach((de,i)=>{if(!s.exercises.some(e=>e.id===de.id))s.exercises.splice(Math.min(i,s.exercises.length),0,de)});
  s.exercises.forEach(e=>{if(!Array.isArray(e.vars)||!e.vars.length)e.vars=[V(e.name||'Exercise')];e.level=Math.max(0,Math.min(e.level|0,e.vars.length-1))});
  return s;
}
let storageOK=true;
function load(){
  try{localStorage.setItem('__ft','1');localStorage.removeItem('__ft')}catch(e){storageOK=false}
  let p=null;try{p=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  return p&&typeof p==='object'?normalize(p):defaults();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}
  catch(e){storageOK=false;toast('Could not save — storage is full or blocked')}
  $('#storageWarn').hidden=storageOK;
}
let S=load();
if(!localStorageHas())save();
function localStorageHas(){try{return !!localStorage.getItem(KEY)}catch(e){return false}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const UI={tab:'today',date:today(),cal:today().slice(0,7),chartVar:null,favEdit:false,meal:null,lastToday:today(),pendingImport:null,exEdit:false,checkEdit:false,carDate:null,carIdx:0,ringPrev:null,pop:null,enter:true};
try{const u=JSON.parse(localStorage.getItem(UIKEY)||'{}');if(u.tab)UI.tab=u.tab}catch(e){}

/* ---------- workout logic ---------- */
const dayType=k=>(S.workouts[k]&&S.workouts[k].type)||S.settings.schedule[pdate(k).getDay()]||'rest';
const exFor=t=>S.exercises.filter(e=>e.day===t||e.day==='both');
const curVar=e=>e.vars[Math.min(e.level,e.vars.length-1)];
const range=(e,v)=>v.unit==='sec'?[e.tmin,e.tmax]:[e.min,e.max];
const unitLbl=u=>u==='sec'?'s':'reps';
function ensureW(k){if(!S.workouts[k])S.workouts[k]={type:dayType(k),done:false,entries:{}};if(!S.workouts[k].entries)S.workouts[k].entries={};return S.workouts[k]}
function sortedWorkoutKeys(){return Object.keys(S.workouts).sort()}
function lastSession(exId,name,before){
  const ks=sortedWorkoutKeys();
  for(let i=ks.length-1;i>=0;i--){const k=ks[i];if(k>=before)continue;const en=S.workouts[k].entries&&S.workouts[k].entries[exId];
    if(en&&en.name===name&&en.sets.some(s=>s.done))return en;}
  return null;
}
function entryFor(k,e,persist){
  const w=S.workouts[k];let en=w&&w.entries&&w.entries[e.id];
  const cv=curVar(e);
  if(en&&!en.sets.some(s=>s.done)&&en.name!==cv.n)en=null;
  if(!en){
    const last=lastSession(e.id,cv.n,k);const lo=range(e,cv)[0];
    en={name:cv.n,unit:cv.unit||'reps',sets:Array.from({length:e.sets},(_,i)=>({v:last&&last.sets.filter(s=>s.done)[i]?last.sets.filter(s=>s.done)[i].v:lo,done:false}))};
    if(persist)ensureW(k).entries[e.id]=en;
  }
  return en;
}
function readyToLevel(e){
  if(e.level>=e.vars.length-1)return false;
  const v=curVar(e),top=range(e,v)[1];
  const ks=sortedWorkoutKeys(),sess=[];
  for(let i=ks.length-1;i>=0&&sess.length<2;i--){const en=S.workouts[ks[i]].entries&&S.workouts[ks[i]].entries[e.id];
    if(en&&en.name===v.n&&en.sets.some(s=>s.done))sess.push(en);}
  return sess.length===2&&sess.every(en=>{const d=en.sets.filter(s=>s.done);return d.length>=e.sets&&d.every(s=>num(s.v,0)>=top)});
}
function streaks(){
  const start=S.settings.startDate||today(),t=today();
  let first=start;const wk=Object.keys(S.workouts).filter(k=>S.workouts[k].done).sort();if(wk.length&&wk[0]<first)first=wk[0];
  // current
  let cur=0;for(let k=t,n=0;k>=first&&n<1500;k=addDays(k,-1),n++){
    const w=S.workouts[k];if(w&&w.done){cur++;continue}
    if(dayType(k)==='rest'||k===t)continue;break;}
  // best
  let best=0,run=0;for(let k=first,n=0;k<=t&&n<3000;k=addDays(k,1),n++){
    const w=S.workouts[k];if(w&&w.done){run++;best=Math.max(best,run);continue}
    if(dayType(k)==='rest'||k===t)continue;run=0;}
  return {cur,best:Math.max(best,cur)};
}
const mondayOf=k=>addDays(k,-((pdate(k).getDay()+6)%7));
const plannedPerWeek=()=>WEEK.filter(d=>S.settings.schedule[d]!=='rest').length;
function doneInWeek(mon){let c=0;for(let i=0;i<7;i++){const w=S.workouts[addDays(mon,i)];if(w&&w.done)c++}return c}

/* ---------- food logic ---------- */
const foodItems=k=>S.food[k]||[];
const proteinTotal=k=>round1(foodItems(k).reduce((a,f)=>a+num(f.protein,0),0));
const kcalTotal=k=>Math.round(foodItems(k).reduce((a,f)=>a+num(f.kcal,0),0));
function defaultMeal(){const h=new Date().getHours();return h<11?'breakfast':h<15?'lunch':h>=17&&h<22?'dinner':'snacks'}

/* ---------- checklist ---------- */
function checklist(k){
  const w=S.workouts[k],t=dayType(k),m=S.checks[k]||{},p=proteinTotal(k),wa=S.water[k]||0;
  const wDone=!!(w&&w.done);
  return [
    {key:'workout',label:t==='rest'&&!wDone?'Rest day — recovery':'Workout done',sub:t==='rest'&&!wDone?'Rest days count toward your plan':wDone?'Nice work':'Tap to mark complete',on:wDone||t==='rest'},
    {key:'protein',label:'Protein target hit',sub:`${p} / ${S.settings.protein} g`,on:p>=S.settings.protein||!!m.protein,auto:p>=S.settings.protein},
    {key:'water',label:'Water target hit',sub:`${wa} / ${S.settings.water} glasses`,on:wa>=S.settings.water||!!m.water,auto:wa>=S.settings.water},
    {key:'sleep',label:'7+ hours of sleep',sub:'Tap when you wake up rested',on:!!m.sleep},
    {key:'study',label:'1 hour of study',sub:'Tap when done',on:!!m.study}
  ].concat((S.settings.customChecks||[]).map(c=>({key:'c_'+c.id,label:c.label,sub:'Your habit',on:!!m['c_'+c.id],custom:c.id})));
}

/* ---------- rendering ---------- */
const R={};
function render(keepScroll){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  const y=window.scrollY;
  const main=$('#main');main.innerHTML=R[UI.tab]();
  if(UI.enter){UI.enter=false;main.classList.remove('enter');void main.offsetWidth;main.classList.add('enter');clearTimeout(UI.enterT);UI.enterT=setTimeout(()=>main.classList.remove('enter'),900)}
  if(UI.tab==='progress')drawCharts();
  if(UI.tab==='today'){initCarousel();const r=$('#ringFg');if(r){const to=+r.dataset.to;requestAnimationFrame(()=>requestAnimationFrame(()=>{r.style.strokeDashoffset=to}));UI.ringPrev=to}}
  if(UI.pop){const el=document.querySelector(UI.pop);if(el)el.classList.add('pop');UI.pop=null}
  const tabs=['today','exercises','food','progress','settings'];$('#navInd').style.transform=`translateX(${tabs.indexOf(UI.tab)*100}%)`;
  const bg=$('#bgwall'),hw=heroWall(UI.date);bg.className='bgwall wp '+wallClass(hw);bg.style.display=S.settings.bgWall&&hw>=0?'':'none';
  const st=streaks();
  $('#hdrStreak').innerHTML=st.cur?`<span>Streak</span> <b>${st.cur}</b>`:'';
  $('#storageWarn').hidden=storageOK;
  if(keepScroll)window.scrollTo(0,y);
}
function dateBar(k){
  const t=today(),isT=k===t;
  const title=isT?'Today':k===addDays(t,-1)?'Yesterday':fmt(k,{weekday:'long'});
  return `<div class="datebar"><button class="nav-btn" data-a="day" data-d="-1" aria-label="Previous day">‹</button>
  <div class="dmid"><div class="dtitle">${title}</div><div class="dsub">${fmt(k,{weekday:'short',day:'numeric',month:'long'})}${isT?'':' · <button class="linkbtn" data-a="gotoday">Today</button>'}</div></div>
  <button class="nav-btn" data-a="day" data-d="1" aria-label="Next day" ${k>=t?'disabled':''}>›</button></div>`;
}

R.today=()=>{
  const k=UI.date,t=dayType(k),w=S.workouts[k],exs=t==='rest'?[]:exFor(t),wDone=!!(w&&w.done);
  let total=0,doneS=0;
  const ens=exs.map(e=>{const en=entryFor(k,e,false);total+=en.sets.length;doneS+=en.sets.filter(s=>s.done).length;return en});
  const pct=total?doneS/total:0;
  if(UI.carDate!==k){UI.carDate=k;let i=ens.findIndex(en=>!en.sets.every(s=>s.done));UI.carIdx=wDone||i<0?exs.length:i;UI.ringPrev=null}
  UI.carIdx=Math.max(0,Math.min(UI.carIdx,exs.length));
  const title=t==='rest'?'Rest day':t==='upper'?'Upper body':'Lower body';
  const sub=t==='rest'?'Recovery is when muscle is built.':wDone?'Workout complete — great job!':`${exs.length} exercises · ${doneS}/${total} sets done`;
  let h=dateBar(k);
  h+=`<section class="hero2"><div class="wpimg wp ${wallClass(heroWall(k))}" style="animation-delay:-${(performance.now()/1000%36).toFixed(2)}s"></div>
    <div class="hero-top"><span class="pill gl">${t==='rest'?'Recover':esc(fmt(k,{weekday:'long'}))}</span>
    <select class="mini gl" data-c="daytype" aria-label="Change workout for this day">${['upper','lower','rest'].map(x=>`<option value="${x}" ${x===t?'selected':''}>${x==='upper'?'Upper':x==='lower'?'Lower':'Rest'}</option>`).join('')}</select></div>
    <div class="hrow"><div><div class="htitle">${title}</div><div class="hsub">${sub}</div></div>${t!=='rest'&&total?ringHTML(pct):''}</div>
    ${t==='rest'?`<div class="grid2"><button class="btn gl" data-a="settype" data-t="upper">Do Upper</button><button class="btn gl" data-a="settype" data-t="lower">Do Lower</button></div>`:''}
  </section>`;
  if(t!=='rest'){
    if(!exs.length)h+=`<div class="card empty">No exercises assigned to this day. Add some in the Exercises tab.</div>`;
    else{
      h+=`<div><div class="car-head"><span class="cnt" id="carCnt">${carLabel(UI.carIdx,exs.length)}</span><div class="car-nav"><button class="exedit-t ${UI.exEdit?'on':''}" data-a="exmode" aria-label="Add or remove exercises">${UI.exEdit?'Done':'Edit'}</button><button data-a="slide" data-d="-1" aria-label="Previous exercise">‹</button><button data-a="slide" data-d="1" aria-label="Next exercise">›</button></div></div>

const carLabel=(i,n)=>i>=n?'Finish':`Exercise ${i+1} of ${n}`;
const RING_C=2*Math.PI*31;
function ringHTML(p){const from=UI.ringPrev==null?RING_C:UI.ringPrev;return `<div class="ring"><svg viewBox="0 0 76 76"><circle class="bg" cx="38" cy="38" r="31"/><circle class="fg" id="ringFg" cx="38" cy="38" r="31" stroke-dasharray="${RING_C.toFixed(1)}" stroke-dashoffset="${from.toFixed(1)}" data-to="${(RING_C*(1-p)).toFixed(1)}"/></svg><b>${Math.round(p*100)}%</b></div>`}
function slideHTML(k,e,en,i){
  const v={n:en.name,unit:en.unit},[lo,hi]=range(e,v),u=unitLbl(v.unit);

    <div class="ex-name">${esc(v.n)}</div><div class="ex-target">${e.sets} sets × ${lo}–${hi} ${v.unit==='sec'?'seconds':'reps'}</div><button class="howpill" data-a="howto" data-ex="${e.id}" data-n="${esc(v.n)}">&#9654; How to</button></div><div class="sbody">`;

      <div class="set-v"><input type="number" inputmode="numeric" min="0" value="${esc(s.v)}" data-c="setval" data-ex="${e.id}" data-i="${j}" aria-label="Set ${j+1} ${u}"><small>${u}</small></div>

function varSeries(){
  const map={};
  sortedWorkoutKeys().forEach(k=>{const es=S.workouts[k].entries||{};
    for(const id in es){const en=es[id],d=en.sets.filter(s=>s.done);if(!d.length)continue;
      (map[en.name]=map[en.name]||{unit:en.unit,pts:[]}).pts.push({k,sets:d.map(s=>num(s.v,0))});}});
  return map;
}
function orderedVarNames(vs){
  const out=[];S.exercises.forEach(e=>e.vars.forEach(v=>{if(vs[v.n]&&!out.includes(v.n))out.push(v.n)}));
  Object.keys(vs).forEach(n=>{if(!out.includes(n))out.push(n)});return out;
}

const WALLKEY='fittrack.wall.custom';
function customWall(){try{const v=localStorage.getItem(WALLKEY);return v?{id:'custom',name:'Yours',src:v}:null}catch(e){return null}}
function wallList(){const c=customWall();return c?WALLS.concat([c]):WALLS}
function heroWall(k){const w=S.settings.wall,L=wallList();if(w==='none')return -1;
  if(w==='rotate'){const n=Math.round(pdate(k).getTime()/864e5);return ((n%L.length)+L.length)%L.length}
  const i=L.findIndex(x=>x.id===w);return i>=0?i:0}
function slideWall(k,i){const h=heroWall(k),L=wallList();if(h<0)return -1;return (h+i+1)%L.length}
function wallClass(i){const L=wallList();return i<0||!L[i]?'wp-none':'wp-'+L[i].id}
function injectWallCSS(){$('#wallcss').textContent=wallList().map(w=>`.wp-${w.id}{background-image:url("${w.src}")}`).join('\n')}
function confetti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#4ade80','#38bdf8','#ffffff','#fbbf24','#f87171','#a78bfa'];
  for(let i=0;i<90;i++){const c=document.createElement('i');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    c.style.setProperty('--dx',(Math.random()*160-80)+'px');c.style.setProperty('--rot',(Math.random()*900-450)+'deg');
    c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*.35)+'s';
    if(Math.random()<.4){c.style.width='9px';c.style.height='9px';c.style.borderRadius='50%'}
    document.body.appendChild(c);setTimeout(()=>c.remove(),4000);}
}
/* ---------- carousel ---------- */
function carOffset(car,i){const c=car.children[i];return c?c.offsetLeft-car.children[0].offsetLeft:0}
function goSlide(i,smooth){const car=$('#car');if(!car)return;i=Math.max(0,Math.min(i,car.children.length-1));
  car.scrollTo({left:carOffset(car,i),behavior:smooth?'smooth':'auto'});UI.carIdx=i;markSlide(i)}
function markSlide(i){const car=$('#car');if(!car)return;
  [...car.children].forEach((c,j)=>c.classList.toggle('dim',j!==i));
  document.querySelectorAll('#dots button').forEach((d,j)=>d.classList.toggle('on',j===i));
  const cnt=$('#carCnt');if(cnt)cnt.textContent=carLabel(i,car.children.length-1)}
function initCarousel(){
  const car=$('#car');if(!car)return;
  car.scrollLeft=carOffset(car,UI.carIdx);
  let raf=0;car.addEventListener('scroll',()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{
    let best=0,bd=1e9;[...car.children].forEach((c,j)=>{const d=Math.abs(carOffset(car,j)-car.scrollLeft);if(d<bd){bd=d;best=j}});
    if(best!==UI.carIdx){UI.carIdx=best;markSlide(best)}})},{passive:true});
}

const DEG=Math.PI/180,dirv=(a,l)=>[Math.cos(a*DEG)*l,Math.sin(a*DEG)*l],vadd=(p,v)=>[p[0]+v[0],p[1]+v[1]];
function ik(r,t,l1,l2,s){const dx=t[0]-r[0],dy=t[1]-r[1];let d=Math.hypot(dx,dy);const base=Math.atan2(dy,dx)/DEG;
  if(d>=l1+l2-0.01)return {m:vadd(r,dirv(base,l1)),e:vadd(r,dirv(base,l1+l2))};
  d=Math.max(d,Math.abs(l1-l2)+0.01);const a=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))))/DEG;
  return {m:vadd(r,dirv(base+s*a,l1)),e:t}}

function drawChart(id,hi){

}

/* ---------- timer ---------- */
const T={end:0,dur:0,iv:null};let actx=null,wake=null;
function audio(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;[0,.25,.5].forEach(d=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=d===.5?1320:880;o.connect(g);g.connect(actx.destination);const t0=actx.currentTime+d;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.35,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.18);o.start(t0);o.stop(t0+.2)})}catch(e){}}
function startTimer(sec){audio();T.dur=sec;T.end=Date.now()+sec*1000;document.body.classList.add('timer-on');if(!T.iv)T.iv=setInterval(tick,250);tick();
  try{if(navigator.wakeLock&&!wake)navigator.wakeLock.request('screen').then(w=>{wake=w;w.addEventListener('release',()=>wake=null)}).catch(()=>{})}catch(e){}}
function stopTimer(){clearInterval(T.iv);T.iv=null;T.end=0;document.body.classList.remove('timer-on');try{wake&&wake.release()}catch(e){}}
function tick(){const ms=T.end-Date.now();if(ms<=0){stopTimer();beep();try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}toast('Rest over — next set!');return}
  const s=Math.ceil(ms/1000);$('#tTime').innerHTML=`<small>REST</small>${Math.floor(s/60)}:${pad(s%60)}`;$('#tBar').style.width=Math.max(0,100-ms/(T.dur*10))+'%'}

/* ---------- modal & toast ---------- */
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){stopDemo();UI.how=null;$('#modal').classList.remove('on','noanim');$('#sheet').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function exEditor(e,day){
  const isNew=!e;e=e||{id:'',name:'',day:day==='lower'?'lower':'upper',sets:3,min:8,max:15,tmin:20,tmax:60,level:0,vars:[]};
  openModal(`<h3>${isNew?'Add exercise':'Edit exercise'}</h3>
  <label class="f"><span>Name / movement group</span><input id="eName" value="${esc(e.name)}" placeholder="e.g. Push"></label>
  <label class="f"><span>Training day</span><select id="eDay">${[['upper','Upper day'],['lower','Lower day'],['both','Both days']].map(([v,l])=>`<option value="${v}" ${e.day===v?'selected':''}>${l}</option>`).join('')}</select></label>
  <div class="grid3"><label class="f"><span>Sets</span><input id="eSets" type="number" inputmode="numeric" value="${e.sets}"></label>
  <label class="f"><span>Min reps</span><input id="eMin" type="number" inputmode="numeric" value="${e.min}"></label>
  <label class="f"><span>Max reps</span><input id="eMax" type="number" inputmode="numeric" value="${e.max}"></label></div>
  <div class="grid2"><label class="f"><span>Timed: min sec</span><input id="eTmin" type="number" inputmode="numeric" value="${e.tmin}"></label>
  <label class="f"><span>Timed: max sec</span><input id="eTmax" type="number" inputmode="numeric" value="${e.tmax}"></label></div>
  <label class="f"><span>Progression ladder — one variation per line, easiest first. Add “| sec” for timed holds (e.g. Plank | sec).</span>
  <textarea id="eVars" rows="6" placeholder="Incline push-up&#10;Push-up&#10;Decline push-up">${esc(e.vars.map(v=>v.n+(v.unit==='sec'?' | sec':'')).join('\n'))}</textarea></label>
  <div class="actions"><button class="btn" data-a="closemodal">Cancel</button><button class="btn primary" data-a="exsave" data-id="${e.id}">Save</button></div>
  ${isNew?'':isFixed(e)?'<p class="small muted" style="text-align:center;margin-top:12px">Built-in exercise — you can edit it, but it can’t be deleted.</p>':`<button class="btn block danger" data-a="exdel" data-id="${e.id}" style="margin-top:10px">Delete exercise</button>`}`);
}

/* ---------- actions ---------- */
const exById=id=>S.exercises.find(e=>e.id===id);
const A={
  day(b){const n=addDays(UI.date,+b.dataset.d);if(n<=today()){UI.date=n;UI.enter=true;render()}},
  gotoday(){UI.date=today();UI.enter=true;render()},
  slide(b){goSlide(UI.carIdx+(+b.dataset.d),true)},
  goslide(b){goSlide(+b.dataset.i,true)},
  settype(b){ensureW(UI.date).type=b.dataset.t;save();render()},
  step(b){const e=exById(b.dataset.ex);if(!e)return;const en=entryFor(UI.date,e,true),s=en.sets[+b.dataset.i],inc=en.unit==='sec'?5:1;
    s.v=Math.max(0,num(s.v,0)+inc*(+b.dataset.d));save();render(true)},
  toggleset(b){const e=exById(b.dataset.ex);if(!e)return;const en=entryFor(UI.date,e,true),s=en.sets[+b.dataset.i];
    const inp=document.querySelector(`input[data-c=setval][data-ex="${e.id}"][data-i="${b.dataset.i}"]`);if(inp&&inp.value!=='')s.v=Math.max(0,Math.round(num(inp.value,s.v)));
    s.done=!s.done;if(s.done&&(s.v===''||s.v==null))s.v=range(e,en)[0];save();
    let adv=false;
    if(s.done){try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}UI.pop=`.set-row[data-ex="${e.id}"][data-i="${b.dataset.i}"]`;
      const exs=exFor(dayType(UI.date)),all=exs.every(x=>entryFor(UI.date,x,false).sets.every(z=>z.done));
      if(all){stopTimer();toast('All sets done — finish your workout!')}else startTimer(S.settings.rest);
      if(en.sets.every(z=>z.done)){adv=exs.findIndex(x=>x.id===e.id)+1;if(!all)toast(`${en.name} done — next up!`)}}
    render(true);
    if(adv!==false)setTimeout(()=>goSlide(adv,true),700)},
  addset(b){const e=exById(b.dataset.ex);const en=entryFor(UI.date,e,true);const l=en.sets[en.sets.length-1];en.sets.push({v:l?l.v:e.min,done:false});save();render(true)},
  rmset(b){const e=exById(b.dataset.ex);const en=entryFor(UI.date,e,true);if(en.sets.length>1&&!en.sets[en.sets.length-1].done)en.sets.pop();save();render(true)},
  complete(){const w=ensureW(UI.date);w.done=!w.done;w.completedAt=w.done?Date.now():null;save();
    if(w.done){stopTimer();confetti();try{navigator.vibrate&&navigator.vibrate([30,60,30])}catch(x){}const s=streaks().cur;toast(s>1?`Workout complete! Streak: ${s} in a row`:'Workout complete — great start!')}render(true)},
  check(b){const k=UI.date,key=b.dataset.k;
    if(key==='workout'){if(dayType(k)==='rest'&&!(S.workouts[k]&&S.workouts[k].done)){toast('Rest day — counts as on plan');return}A.complete();return}
    const c=checklist(k).find(x=>x.key===key);if(c&&c.auto){toast('Ticked automatically from your log');return}
    S.checks[k]=S.checks[k]||{};S.checks[k][key]=!S.checks[k][key];save();if(S.checks[k][key])UI.pop=`.check[data-k=${key}]`;render(true)},
  levelup(b){const e=exById(b.dataset.id);if(!e||e.level>=e.vars.length-1)return;e.level++;save();confetti();toast(`Level up! Now training ${curVar(e).n}`);render(true)},
  setlevel(b){const e=exById(b.dataset.id);const i=+b.dataset.i;if(!e||i===e.level)return;e.level=i;save();toast(`Now training ${curVar(e).n}`);render(true)},
  exedit(b){exEditor(exById(b.dataset.id))},
  exnew(b){exEditor(null,b&&b.dataset.day)},
  howto(b){openHow(b.dataset.ex,b.dataset.n||null)},
  howvar(b){if(UI.how)openHow(UI.how.exId,b.dataset.n)},
  howphoto(){$('#photoFile').value='';$('#photoFile').click()},
  howphotodel(){if(!UI.how)return;const p=photos();delete p[photoKey(UI.how.name)];try{localStorage.setItem(PHOTOKEY,JSON.stringify(p))}catch(e){}toast('Photo removed');openHow(UI.how.exId,UI.how.name)},
  exmode(){UI.exEdit=!UI.exEdit;render(true)},
  exdelq(b){const e=exById(b.dataset.id);if(!e||isFixed(e))return;
    if(!b.dataset.armed){b.dataset.armed='1';b.classList.add('armed');b.textContent='Delete?';toast(`Tap again to delete ${e.name}`);return}
    S.exercises=S.exercises.filter(x=>x.id!==e.id);save();toast(`${e.name} removed`);render(true)},
  closemodal(){closeModal()},
  exsave(b){
    const name=$('#eName').value.trim();
    const vars=$('#eVars').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.*?)\s*\|\s*(s|sec|secs|seconds|timed)\s*$/i);return m?V(m[1].trim(),'sec'):V(l)}).filter(v=>v.n);
    if(!name){toast('Give it a name');return}
    if(!vars.length){toast('Add at least one variation');return}
    const sets=Math.max(1,Math.min(10,parseInt($('#eSets').value)||3));
    let mn=Math.max(1,parseInt($('#eMin').value)||8),mx=Math.max(1,parseInt($('#eMax').value)||15);if(mn>mx)[mn,mx]=[mx,mn];
    let tmn=Math.max(5,parseInt($('#eTmin').value)||20),tmx=Math.max(5,parseInt($('#eTmax').value)||60);if(tmn>tmx)[tmn,tmx]=[tmx,tmn];
    let e=exById(b.dataset.id);
    const wasNew=!e;if(!e){e={id:uid(),level:0};S.exercises.push(e)}
    const curName=e.vars?curVar(e).n:null;
    Object.assign(e,{name,day:$('#eDay').value,sets,min:mn,max:mx,tmin:tmn,tmax:tmx,vars});
    const keep=vars.findIndex(v=>v.n===curName);e.level=keep>=0?keep:Math.min(e.level||0,vars.length-1);
    if(wasNew&&UI.tab==='today'){const ix=exFor(dayType(UI.date)).findIndex(x=>x.id===e.id);if(ix>=0)UI.carIdx=ix}
    save();closeModal();toast(wasNew?`${name} added`:'Exercise saved');render(true);if(wasNew&&UI.tab==='today')setTimeout(()=>goSlide(UI.carIdx,true),50)},
  exdel(b){if(isFixed(exById(b.dataset.id)))return;if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Tap again to delete (history is kept)';return}
    S.exercises=S.exercises.filter(e=>e.id!==b.dataset.id);save();closeModal();toast('Exercise removed');render(true)},
  meal(b){UI.meal=b.dataset.m;const keep=['fName','fProt','fKcal'].map(id=>$('#'+id).value),fav=$('#fFav').checked;render(true);['fName','fProt','fKcal'].forEach((id,i)=>$('#'+id).value=keep[i]);$('#fFav').checked=fav},
  addfood(){const name=$('#fName').value.trim(),p=num($('#fProt').value,NaN),kc=num($('#fKcal').value,null);
    if(!name){toast('Enter a food name');$('#fName').focus();return}
    if(!isFinite(p)||p<0){toast('Enter protein in grams');$('#fProt').focus();return}
    const meal=UI.meal||defaultMeal(),item={id:uid(),meal,name,protein:round1(p),kcal:kc!=null&&kc>=0?Math.round(kc):null};
    (S.food[UI.date]=S.food[UI.date]||[]).push(item);
    if($('#fFav').checked&&!S.favourites.some(f=>f.name.toLowerCase()===name.toLowerCase()))S.favourites.push({name,protein:item.protein,kcal:item.kcal});
    save();toast(`Added ${name} · ${item.protein} g`);render(true)},
  fav(b){const f=S.favourites[+b.dataset.i];if(!f)return;const meal=UI.meal||defaultMeal();
    (S.food[UI.date]=S.food[UI.date]||[]).push({id:uid(),meal,name:f.name,protein:f.protein,kcal:f.kcal});save();toast(`Added ${f.name} to ${meal}`);render(true)},
  favedit(){UI.favEdit=!UI.favEdit;render(true)},
  favdel(b){S.favourites.splice(+b.dataset.i,1);if(!S.favourites.length)UI.favEdit=false;save();render(true)},
  fooddel(b){S.food[UI.date]=foodItems(UI.date).filter(f=>f.id!==b.dataset.id);if(!S.food[UI.date].length)delete S.food[UI.date];save();render(true)},
  water(b){const k=UI.date;S.water[k]=Math.max(0,(S.water[k]||0)+(+b.dataset.d));if(S.water[k]===S.settings.water&&+b.dataset.d>0)toast('Water target hit!');save();render(true)},
  glass(b){const k=UI.date,i=+b.dataset.i,n=S.water[k]||0;S.water[k]=(i+1===n)?i:i+1;save();render(true)},
  cal(b){const [y,m]=UI.cal.split('-').map(Number),d=new Date(y,m-1+(+b.dataset.d),1);UI.cal=d.getFullYear()+'-'+pad(d.getMonth()+1);render(true)},
  calday(b){const k=b.dataset.k;if(k>today())return;UI.date=k;go('today')},
  bodyadd(){const d=$('#bDate').value||today(),w=num($('#bW').value,null),wa=num($('#bWaist').value,null);
    if(w==null&&wa==null){toast('Enter weight and/or waist');return}
    const ex=S.body.find(b=>b.date===d);if(ex){if(w!=null)ex.weight=round1(w);if(wa!=null)ex.waist=round1(wa)}else S.body.push({date:d,weight:w!=null?round1(w):null,waist:wa!=null?round1(wa):null});
    save();toast('Measurement saved');render(true)},
  bodydel(b){S.body=S.body.filter(x=>x.date!==b.dataset.date);save();render(true)},
  sched(b){S.settings.schedule[b.dataset.d]=b.dataset.t;save();render(true)},
  restpreset(b){S.settings.rest=+b.dataset.v;save();toast(`Rest timer: ${b.dataset.v}s`);render(true)},
  theme(b){S.settings.theme=b.dataset.v;save();applyTheme();render(true)},
  tadd(b){if(!T.end)return;T.end+=(+b.dataset.s)*1000;T.dur=Math.max(1,T.dur+(+b.dataset.s));tick()},
  tskip(){stopTimer()},
  checkedit(){UI.checkEdit=!UI.checkEdit;render(true);if(UI.checkEdit){const i=$('#newCheck');i&&i.focus()}},
  checkadd(){const i=$('#newCheck'),v=(i&&i.value||'').trim();if(!v){toast('Type a habit first');return}
    (S.settings.customChecks=S.settings.customChecks||[]).push({id:uid(),label:v});save();toast(`Added “${v}”`);render(true);const n=$('#newCheck');n&&n.focus()},
  checkdel(b){S.settings.customChecks=(S.settings.customChecks||[]).filter(c=>c.id!==b.dataset.id);save();toast('Removed');render(true)},
  wall(b){S.settings.wall=b.dataset.v;save();render(true)},
  wallup(){$('#wallFile').value='';$('#wallFile').click()},
  walldel(){try{localStorage.removeItem(WALLKEY)}catch(e){}if(S.settings.wall==='custom')S.settings.wall='rotate';save();injectWallCSS();render(true)},
  export(){try{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`fittrack-backup-${today()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
    S.settings.lastExport=today();save();toast('Backup exported');render(true)}catch(e){toast('Export failed: '+e.message)}},
  import(){$('#importFile').value='';$('#importFile').click()},
  importgo(){if(!UI.pendingImport)return;S=normalize(UI.pendingImport);UI.pendingImport=null;save();closeModal();UI.date=today();applyTheme();toast('Backup restored');render()},
  reset(){openModal(`<h3>Reset all data?</h3><p class="muted">This permanently deletes every workout, food log, measurement and setting on this device. Export a backup first if you might want it back.</p>
    <label class="f"><span>Type RESET to confirm</span><input id="resetTxt" autocomplete="off" autocapitalize="characters"></label>
    <div class="actions"><button class="btn" data-a="closemodal">Cancel</button><button class="btn danger" data-a="resetgo">Delete everything</button></div>`)},
  resetgo(){if(($('#resetTxt').value||'').trim().toUpperCase()!=='RESET'){toast('Type RESET to confirm');return}
    S=defaults();save();closeModal();UI.date=today();UI.chartVar=null;applyTheme();toast('All data reset');render()}
};
document.addEventListener('click',ev=>{
  const tb=ev.target.closest('nav.tabs button');if(tb){go(tb.dataset.tab);return}
  const b=ev.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(f){ev.preventDefault();f(b,ev)}
});
document.addEventListener('change',ev=>{
  const el=ev.target,c=el.dataset&&el.dataset.c;if(!c)return;
  if(c==='setval'){const e=exById(el.dataset.ex);if(!e)return;const en=entryFor(UI.date,e,true);en.sets[+el.dataset.i].v=Math.max(0,Math.round(num(el.value,0)));el.value=en.sets[+el.dataset.i].v;save()}
  else if(c==='bgwall'){S.settings.bgWall=el.checked;save();render(true)}
  else if(c==='daytype'){ensureW(UI.date).type=el.value;save();render(true)}
  else if(c==='chartvar'){UI.chartVar=el.value;render(true)}
  else if(c==='setting'){const k=el.dataset.k,min={protein:0,water:1,rest:10}[k];const v=Math.max(min,Math.round(num(el.value,S.settings[k])));S.settings[k]=v;save();toast('Saved');render(true)}
});
$('#importFile').addEventListener('change',ev=>{
  const f=ev.target.files&&ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{let p;try{p=JSON.parse(r.result)}catch(e){toast('That file is not valid JSON');return}
    if(!p||typeof p!=='object'||!p.settings||!Array.isArray(p.exercises)){toast('Not a FitTrack backup file');return}
    UI.pendingImport=p;const nw=Object.values(p.workouts||{}).filter(w=>w.done).length,nf=Object.keys(p.food||{}).length;
    openModal(`<h3>Restore backup?</h3><p class="muted">This backup has <b>${nw}</b> completed workouts and <b>${nf}</b> days of food logs. It will <b>replace</b> all data currently on this device.</p>
      <div class="actions"><button class="btn" data-a="closemodal">Cancel</button><button class="btn primary" data-a="importgo">Replace &amp; restore</button></div>`)};
  r.readAsText(f);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='newCheck'){ev.preventDefault();A.checkadd()}});
$('#photoFile').addEventListener('change',ev=>{const f=ev.target.files&&ev.target.files[0];if(!f||!UI.how)return;const h=UI.how;
  compressImage(f,900,.78,url=>{const p=photos();p[photoKey(h.name)]=url;try{localStorage.setItem(PHOTOKEY,JSON.stringify(p));toast('Photo saved')}catch(e){toast('Not enough space — try a smaller photo')}openHow(h.exId,h.name)})});
$('#wallFile').addEventListener('change',ev=>{
  const f=ev.target.files&&ev.target.files[0];if(!f)return;const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{const sc=Math.min(1,1280/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
    try{localStorage.setItem(WALLKEY,cv.toDataURL('image/jpeg',.8));S.settings.wall='custom';save();injectWallCSS();toast('Wallpaper set');render(true)}catch(e){toast('Image too large to save — try a smaller one')}};
  img.onerror=()=>toast('Could not read that image');img.src=url;
});
function go(tab){if(tab!==UI.tab)UI.enter=true;UI.tab=tab;try{localStorage.setItem(UIKEY,JSON.stringify({tab}))}catch(e){}render();window.scrollTo(0,0)}
function applyTheme(){document.documentElement.dataset.theme=S.settings.theme||'auto';
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(UI.tab==='progress')drawCharts()},150)});
try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();if(UI.tab==='progress')drawCharts()})}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;const t=today();
  if(UI.lastToday!==t){if(UI.date===UI.lastToday)UI.date=t;UI.lastToday=t;render(true)}if(T.end)tick()});
window.addEventListener('storage',ev=>{if(ev.key===KEY){S=load();render(true)}});

injectWallCSS();applyTheme();render();
window.__ft={get S(){return S},today,readyToLevel,streaks};
})();
</script>
<script>try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js')}catch(e){}</script>
